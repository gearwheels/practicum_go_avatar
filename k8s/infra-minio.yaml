# СГЕНЕРИРОВАНО автоматически из helm/gophprofile — не редактируйте вручную.
# Обновить: ./scripts/render-k8s.sh
#
# Значения взяты из helm/gophprofile/values.yaml. Для другого окружения
# используйте Helm напрямую с нужным values-файлом.
---
# Source: gophprofile/templates/infra-minio.yaml
# MinIO — S3-совместимое хранилище для локального стенда.
# В продакшене выключается, а приложение направляется на настоящий S3.
apiVersion: v1
kind: Service
metadata:
  name: gophprofile-minio
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/component: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
# Source: gophprofile/templates/infra-minio.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gophprofile-minio
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/component: minio
spec:
  serviceName: gophprofile-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: gophprofile
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        helm.sh/chart: gophprofile-0.1.0
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/instance: gophprofile
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: gophprofile
        app.kubernetes.io/component: minio
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secrets
                  key: MINIO_ROOT_PASSWORD
            # Открывает /minio/v2/metrics/cluster без токена для Prometheus.
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
