# СГЕНЕРИРОВАНО автоматически из helm/gophprofile — не редактируйте вручную.
# Обновить: ./scripts/render-k8s.sh
#
# Значения взяты из helm/gophprofile/values.yaml. Для другого окружения
# используйте Helm напрямую с нужным values-файлом.
---
# Source: gophprofile/templates/networkpolicy.yaml
# Модель: всё запрещено, кроме явно разрешённого. Поды приложения могут
# ходить только в свою инфраструктуру и в DNS, а принимать трафик — только
# от ingress-контроллера и системы мониторинга.
#
# Внимание: политики применяет CNI. Дефолтный kindnet в kind их НЕ
# обеспечивает — манифесты будут приняты кластером, но фактической изоляции
# на локальном стенде не будет (нужен, например, Calico).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gophprofile-default-deny
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: gophprofile
  policyTypes:
    - Ingress
    - Egress

---
# Source: gophprofile/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gophprofile-server
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: gophprofile
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Пользовательский трафик приходит только через ingress-контроллер.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Скрейп метрик из namespace мониторинга.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS — иначе поды не разрешат имена сервисов.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Собственная инфраструктура релиза: Postgres, RabbitMQ, MinIO.
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["postgres", "rabbitmq", "minio"]
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 9000

---
# Source: gophprofile/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gophprofile-worker
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: gophprofile
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # У воркера нет API: внутрь пускаем только скрейп метрик.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9091
  egress:
    # DNS — иначе поды не разрешат имена сервисов.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Собственная инфраструктура релиза: Postgres, RabbitMQ, MinIO.
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["postgres", "rabbitmq", "minio"]
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 9000

---
# Source: gophprofile/templates/networkpolicy.yaml
# Джобы (миграции, создание бакета) тоже попадают под default-deny, потому
# что несут общие метки релиза. Без собственных правил у них не работает
# даже DNS, и Job зависает на таймаутах резолва — поэтому правила нужны
# отдельно, а не только для server/worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gophprofile-jobs
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["migrate", "minio-init"]
      - key: app.kubernetes.io/instance
        operator: In
        values: ["gophprofile"]
  policyTypes:
    - Egress
  egress:
    # DNS — иначе поды не разрешат имена сервисов.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Собственная инфраструктура релиза: Postgres, RabbitMQ, MinIO.
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["postgres", "rabbitmq", "minio"]
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 9000

---
# Source: gophprofile/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gophprofile-infra
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["postgres", "rabbitmq", "minio"]
      - key: app.kubernetes.io/instance
        operator: In
        values: ["gophprofile"]
  policyTypes:
    - Ingress
  ingress:
    # К инфраструктуре ходят только поды этого релиза.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gophprofile
              app.kubernetes.io/instance: gophprofile


