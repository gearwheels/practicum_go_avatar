# СГЕНЕРИРОВАНО автоматически из helm/gophprofile — не редактируйте вручную.
# Обновить: ./scripts/render-k8s.sh
#
# Значения взяты из helm/gophprofile/values.yaml. Для другого окружения
# используйте Helm напрямую с нужным values-файлом.
---
# Source: gophprofile/templates/servicemonitor.yaml
# Создаётся, только если в кластере есть CRD Prometheus Operator.
# Prometheus сам находит поды по селектору и снимает с них /metrics —
# статический список таргетов в конфиге больше не нужен.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gophprofile-server
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/component: server
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - gophprofile
  selector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: gophprofile
      app.kubernetes.io/component: server
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
