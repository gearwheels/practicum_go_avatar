# СГЕНЕРИРОВАНО автоматически из helm/gophprofile — не редактируйте вручную.
# Обновить: ./scripts/render-k8s.sh
#
# Значения взяты из helm/gophprofile/values.yaml. Для другого окружения
# используйте Helm напрямую с нужным values-файлом.
---
# Source: gophprofile/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
# Приложение не обращается к API Kubernetes, поэтому токен в поды не
# монтируется: украденный токен из скомпрометированного пода не даст
# злоумышленнику доступа к кластеру.
automountServiceAccountToken: false

---
# Source: gophprofile/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
# Принцип наименьших привилегий: доступ только на чтение собственной
# конфигурации в своём namespace. Никаких прав на secrets, поды или узлы.
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - gophprofile-config
    verbs: ["get", "watch"]

---
# Source: gophprofile/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gophprofile
subjects:
  - kind: ServiceAccount
    name: gophprofile
    namespace: gophprofile

