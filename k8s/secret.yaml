# СГЕНЕРИРОВАНО автоматически из helm/gophprofile — не редактируйте вручную.
# Обновить: ./scripts/render-k8s.sh
#
# Значения взяты из helm/gophprofile/values.yaml. Для другого окружения
# используйте Helm напрямую с нужным values-файлом.
#
# ВНИМАНИЕ: пароли здесь — заглушки CHANGE_ME. Перед kubectl apply
# подставьте свои значения или создайте Secret отдельно.
---
# Source: gophprofile/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gophprofile-secrets
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
type: Opaque
stringData:
  # Пароли подставляются через хелперы с required: если пароль не задан,
  # рендер падает здесь, а не в рабочем кластере с известным дефолтом.
  #
  # DSN содержат пароли целиком, поэтому лежат в Secret, а не в ConfigMap.
  DATABASE_URL: "postgres://avatar:CHANGE_ME@gophprofile-postgres:5432/avatar_service?sslmode=disable"
  RABBITMQ_URL: "amqp://guest:CHANGE_ME@gophprofile-rabbitmq:5672/"
  # Приложение использует те же имена переменных, что и сам MinIO, поэтому
  # один Secret питает и клиент, и сервер хранилища.
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
  POSTGRES_USER: "avatar"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "avatar_service"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
