package: api
output: ../internal/api/server.gen.go
generate:
  models: true
  echo-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: true
  # /metrics обслуживает middleware echoprometheus, а не сгенерированный
  # обработчик: в спецификации эндпоинт описан для полноты, но роут для него
  # генерировать не нужно — иначе он конфликтовал бы с middleware.
  exclude-operation-ids:
    - getMetrics