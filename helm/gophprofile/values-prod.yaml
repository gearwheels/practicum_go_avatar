# Продакшен-окружение.
#
# Ключевое отличие от локального стенда: БД, брокер и хранилище — внешние
# managed-сервисы, а не поды в кластере. Учётные данные берутся из
# существующего Secret, созданного вне чарта (внешним менеджером секретов).
#
# helm install gophprofile helm/gophprofile -f helm/gophprofile/values-prod.yaml \
#   --set image.tag=1.0.0 --set ingress.host=avatars.example.com

image:
  repository: registry.example.com/gophprofile
  # Тег задаётся явно при выкате: latest в проде не используется.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: registry-credentials

server:
  replicaCount: 3
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: "1"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

worker:
  replicaCount: 3
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: "1"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

config:
  logLevel: info
  minioBucket: avatars
  minioUseSSL: "true"
  otlpEndpoint: otel-collector.observability.svc.cluster.local:4317
  runMigrations: "false"

# Все чувствительные значения приходят из внешнего Secret; в values их нет.
# Secret должен содержать ключи: DATABASE_URL, RABBITMQ_URL,
# MINIO_ROOT_USER, MINIO_ROOT_PASSWORD.
secrets:
  existingSecret: gophprofile-credentials

ingress:
  enabled: true
  className: nginx
  host: avatars.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - avatars.example.com
      secretName: gophprofile-tls

serviceMonitor:
  enabled: true
  interval: 30s

networkPolicy:
  enabled: true

# Инфраструктура — внешняя: managed Postgres, брокер и объектное хранилище.
infra:
  postgres:
    enabled: false
  rabbitmq:
    enabled: false
  minio:
    enabled: false
