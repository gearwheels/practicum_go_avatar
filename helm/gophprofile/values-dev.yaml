# Локальная разработка в kind.
# helm install gophprofile helm/gophprofile -f helm/gophprofile/values-dev.yaml

image:
  tag: local
  pullPolicy: Never # образ загружается через `kind load docker-image`

server:
  replicaCount: 2
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 300m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5

worker:
  replicaCount: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 300m
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

config:
  logLevel: debug
  # Трейсинг выключен: Jaeger живёт в docker-compose, а не в кластере.
  otlpEndpoint: ""

ingress:
  enabled: true
  host: avatars.local

# ServiceMonitor, алерты и дашборды: стек мониторинга ставится скриптом
# monitoring/k8s/install.sh. Без него ресурсы Prometheus Operator просто
# не создаются.
serviceMonitor:
  enabled: true

alerts:
  enabled: true

# kindnet (kind >= 0.24) применяет NetworkPolicy — изоляция на стенде реальная.
networkPolicy:
  enabled: true

infra:
  postgres:
    enabled: true
    storage: 1Gi
  rabbitmq:
    enabled: true
    storage: 1Gi
  minio:
    enabled: true
    storage: 2Gi
