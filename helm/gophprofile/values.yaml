# Значения по умолчанию для чарта GophProfile.
# Рассчитаны на локальный кластер (kind): инфраструктура поднимается внутри
# кластера, образ берётся локальный. Для продакшена см. values-prod.yaml.

nameOverride: ""
fullnameOverride: ""

image:
  repository: gophprofile
  tag: local
  # IfNotPresent — образ загружается в kind через `kind load docker-image`,
  # тянуть его из реестра не нужно и негде.
  pullPolicy: IfNotPresent

imagePullSecrets: []

# --- HTTP API ---
server:
  replicaCount: 2

  containerPort: 8080

  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # Запас над временем корректного завершения: сервер даёт до 10с на дренаж
  # HTTP и до 5с на досылку трейсов (см. cmd/server/main.go).
  terminationGracePeriodSeconds: 45

  # Пауза перед остановкой: за это время kube-proxy на всех узлах успевает
  # убрать под из endpoints, и клиенты не попадают в закрывающийся под.
  preStopSleepSeconds: 5

  probes:
    # Готовность НЕ проверяет внешние зависимости. БД, S3 и брокер общие для
    # всех реплик: если бы readiness смотрела на /health, отказ одного S3
    # разом вывел бы из балансировки все поды, и сервис отдавал бы 503 от
    # nginx на всё, включая то, что без S3 работает (метаданные, списки).
    # Отказ зависимостей обрабатывает circuit breaker (быстрые 503 только на
    # затронутых операциях), а /health остаётся для мониторинга и алертов.
    readiness:
      path: /livez
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    # Жизнеспособность НЕ должна зависеть от внешних сервисов, иначе кратковременная
    # недоступность Postgres перезапустит разом все реплики. /livez проверяет
    # только невосстановимое состояние процесса.
    liveness:
      path: /livez
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    # Стартовая проба даёт время на подключение к зависимостям и не даёт
    # liveness убить под во время долгого старта.
    startup:
      path: /livez
      periodSeconds: 5
      failureThreshold: 30

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

# --- Фоновый обработчик ---
worker:
  replicaCount: 2

  metricsPort: 9091

  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # Больше, чем у сервера: воркер может держать в обработке сообщение
  # (скачивание оригинала, генерация миниатюр).
  terminationGracePeriodSeconds: 60

  probes:
    # Как и у сервера, без зависимостей: неготовый под выпадает из endpoints,
    # и Prometheus перестал бы снимать с него метрики ровно во время аварии.
    readiness:
      path: /livez
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /livez
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

# --- Конфигурация приложения (попадает в ConfigMap) ---
config:
  logLevel: info
  minioBucket: avatars
  minioUseSSL: "false"
  # Пусто = трейсинг выключен. Для отправки трейсов в Jaeger укажите
  # адрес OTLP-коллектора, например jaeger-collector.observability:4317
  otlpEndpoint: ""
  # Миграции в Kubernetes накатывает Job-хук, а не поды сервера.
  runMigrations: "false"
  # Ограничение частоты запросов в каждом поде сервера: на пользователя
  # (X-User-ID), без заголовка — на IP. 0 выключает лимит.
  rateLimitRPS: "20"
  rateLimitBurst: "40"
  # Circuit breaker для Postgres, S3 и RabbitMQ: после стольких отказов
  # подряд обращения к зависимости не выполняются и сразу получают 503, а
  # через openTimeout пропускается пробный запрос.
  circuitBreakerFailureThreshold: "5"
  circuitBreakerOpenTimeout: 30s

# --- Секреты ---
# Значения по умолчанию годятся только для локального стенда.
# В продакшене используйте существующий Secret (existingSecret) или
# внешний менеджер секретов.
secrets:
  existingSecret: ""
  postgresUser: avatar
  postgresPassword: avatar
  postgresDatabase: avatar_service
  rabbitmqUser: guest
  rabbitmqPassword: guest
  minioUser: minioadmin
  minioPassword: minioadmin
  # Если инфраструктура внешняя (infra.*.enabled=false), задайте DSN целиком.
  databaseUrl: ""
  rabbitmqUrl: ""

# --- Ingress ---
ingress:
  enabled: true
  className: nginx
  host: avatars.local
  path: /
  pathType: Prefix
  annotations:
    # Без этого nginx режет тело запроса на 1MB, а сервис принимает файлы до 10MB.
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Первый рубеж rate limiting — по IP клиента, ещё до подов. Защищает от
    # флуда, который обходит лимит приложения сменой X-User-ID.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
  tls: []

# --- Мониторинг ---
# ServiceMonitor и PrometheusRule — ресурсы Prometheus Operator. Если его CRD
# в кластере нет, шаблоны пропускаются, а не ломают установку.
# Стек мониторинга для kind: monitoring/k8s/install.sh.
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  # Стандартный kube-prometheus-stack берёт только ресурсы с меткой release,
  # равной имени его релиза. Без неё ServiceMonitor молча игнорируется.
  labels:
    release: kube-prometheus-stack
  # Скрейп встроенного RabbitMQ (глубина очередей на дашборде).
  rabbitmq: true

alerts:
  enabled: true
  labels:
    release: kube-prometheus-stack
  # Пороги правил (см. templates/prometheusrule.yaml).
  errorRatePercent: 5
  latencyP95Seconds: 1
  rateLimitRejectionsPerSecond: 1

# Дашборды Grafana в ConfigMap: sidecar Grafana подхватывает их по метке.
grafanaDashboards:
  enabled: true
  label: grafana_dashboard
  labelValue: "1"

# --- Безопасность ---
serviceAccount:
  create: true
  name: ""
  # Приложению не нужен доступ к API Kubernetes — токен не монтируем.
  automountServiceAccountToken: false

rbac:
  create: true

networkPolicy:
  enabled: true
  # Метки namespace, из которого разрешён вход трафика к серверу.
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  # Метки namespace, откуда Prometheus скрейпит метрики.
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
  # Дополнительные разрешения исходящего трафика — например, к managed
  # Postgres/S3 вне кластера или к OTLP-коллектору (см. values-prod.yaml).
  extraEgress: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

# --- Инфраструктура в кластере ---
# Для локального стенда — включена. В продакшене выключается, а адреса
# managed-сервисов передаются через secrets.databaseUrl / rabbitmqUrl.
infra:
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 1Gi
    storageClass: ""
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

  rabbitmq:
    enabled: true
    image: rabbitmq:3.13-management-alpine
    storage: 1Gi
    storageClass: ""
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 768Mi
        cpu: 500m

  minio:
    enabled: true
    # Образы берутся с quay.io: на Docker Hub репозитории minio/minio и
    # minio/mc больше не отдаются анонимно (pull access denied).
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    # Образ клиента mc для Job, создающего бакет
    mcImage: quay.io/minio/mc:latest
    storage: 2Gi
    storageClass: ""
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 768Mi
        cpu: 500m
