{{- if .Values.infra.rabbitmq.enabled }}
# RabbitMQ для локального стенда. Образ management-alpine уже включает
# плагин rabbitmq_prometheus (метрики на порту 15692).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.rabbitmqServiceName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  selector:
    {{- include "gophprofile.selectorLabels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    - name: metrics
      port: 15692
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gophprofile.fullname" . }}-rabbitmq
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: {{ include "gophprofile.rabbitmqServiceName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" (dict "ctx" . "component" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gophprofile.labels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: {{ .Values.infra.rabbitmq.image }}
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: metrics
              containerPort: 15692
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: RABBITMQ_DEFAULT_PASS
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            {{- toYaml .Values.infra.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.infra.rabbitmq.storageClass }}
        storageClassName: {{ .Values.infra.rabbitmq.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.infra.rabbitmq.storage }}
{{- end }}
