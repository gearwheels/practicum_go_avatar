{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gophprofile.serviceAccountName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
# Приложение не обращается к API Kubernetes, поэтому токен в поды не
# монтируется: украденный токен из скомпрометированного пода не даст
# злоумышленнику доступа к кластеру.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
# Принцип наименьших привилегий: доступ только на чтение собственной
# конфигурации в своём namespace. Никаких прав на secrets, поды или узлы.
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ include "gophprofile.fullname" . }}-config
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gophprofile.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gophprofile.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
