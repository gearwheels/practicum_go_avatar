{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.fullname" . }}-secrets
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  # DSN содержат пароли целиком, поэтому лежат в Secret, а не в ConfigMap.
  DATABASE_URL: {{ include "gophprofile.databaseUrl" . | quote }}
  RABBITMQ_URL: {{ include "gophprofile.rabbitmqUrl" . | quote }}
  # Приложение использует те же имена переменных, что и сам MinIO, поэтому
  # один Secret питает и клиент, и сервер хранилища.
  MINIO_ROOT_USER: {{ .Values.secrets.minioUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioPassword | quote }}
  {{- if .Values.infra.postgres.enabled }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDatabase | quote }}
  {{- end }}
  {{- if .Values.infra.rabbitmq.enabled }}
  RABBITMQ_DEFAULT_USER: {{ .Values.secrets.rabbitmqUser | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.secrets.rabbitmqPassword | quote }}
  {{- end }}
{{- end }}
